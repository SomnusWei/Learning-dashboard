# 个人学习工作台 · Nginx 配置
# 监听 443（容器内），通过 docker-compose 端口映射 8443:443 对外
# 用法：宿主机 8443 → 容器 443 → Nginx

worker_processes auto;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 10M;  # 上传图片上限，配合后端 5MB 限制

    # 日志
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # ===== 速率限制 =====
    # 登录接口：每 IP 每分钟最多 10 次请求（防暴力破解）
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;
    # 通用 API：每 IP 每秒 20 次，突发 40 次
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
    # OCR 接口：每 IP 每分钟最多 5 次（防止滥用 CPU 密集型服务）
    limit_req_zone $binary_remote_addr zone=ocr_limit:10m rate=5r/m;

    # 上游后端
    upstream backend_api {
        server backend:8000;
        keepalive 32;
    }

    # HTTP → HTTPS 重定向
    server {
        listen 80;
        server_name your-domain.com _;
        return 301 https://$host:8443$request_uri;
    }

    # HTTPS 主入口
    server {
        listen 443 ssl;
        server_name your-domain.com;

        # SSL 证书
        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # 安全头
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        root /usr/share/nginx/html;
        index index.html;

        # PWA Service Worker 不缓存
        location = /sw.js {
            root /usr/share/nginx/html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
        location = /registerSW.js {
            root /usr/share/nginx/html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # 静态资源缓存
        location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
        }

        # 登录接口：严格限速（防暴力破解）
        location = /api/v1/auth/login {
            limit_req zone=login_limit burst=3 nodelay;
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 8443;
        }

        # OCR 接口：限制调用频率
        location /api/v1/wrong-questions/ocr {
            limit_req zone=ocr_limit burst=2 nodelay;
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 8443;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # API 反向代理（通用限速）
        location /api/ {
            limit_req zone=api_limit burst=40 nodelay;
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 8443;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # OpenAPI 文档
        location /docs {
            proxy_pass http://backend_api/docs;
            proxy_set_header Host $host;
        }
        location /openapi.json {
            proxy_pass http://backend_api/api/v1/openapi.json;
            proxy_set_header Host $host;
        }

        # 健康检查
        location = /health {
            proxy_pass http://backend_api/health;
            access_log off;
        }

        # PWA history 模式
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
